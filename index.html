<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Memory Battle</title>

<!-- Fun Font for Kids -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* OVERALL CHEERFUL THEME - DEEP PURPLE BACKGROUND */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  font-family: 'Fredoka', sans-serif;
  background-color: #2b1294; 
  background-image: radial-gradient(circle at top left, #4422b5, #17075c);
  color: #333;
  text-align: center;
  overflow-x: hidden;
}

.main-wrapper {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 40px 15px 30px 15px; 
  box-sizing: border-box;
}

h1 { margin: 0 0 20px 0; font-size: 32px; color: #fff; text-shadow: 3px 3px 0px rgba(0,0,0,0.3); }
h2 { margin-top: 0; color: #2979ff; }
h3 { margin-top: 0; color: #333; }

/* ANIMASI KARAKTER BINATANG */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}
.cute-animals {
  font-size: 45px;
  margin-bottom: 10px;
  animation: float 3s ease-in-out infinite;
  display: flex;
  justify-content: center;
  gap: 15px;
  text-shadow: 2px 4px 10px rgba(0,0,0,0.3);
}

/* MAIN MENU CARD */
.game-card {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 24px;
  padding: 30px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  border: 4px solid #fff;
  margin-bottom: 20px;
  position: relative;
}

/* 3D BUTTON STYLE */
button {
  font-family: 'Fredoka', sans-serif;
  font-size: 16px;
  font-weight: 700;
  padding: 12px 20px;
  margin: 5px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  transition: all 0.15s ease-in-out;
  color: #fff;
}

button:active:not(:disabled) {
  transform: translateY(6px);
  box-shadow: 0 0px 0 transparent !important;
}

button:disabled {
  background: #e0e0e0 !important;
  color: #9e9e9e !important;
  box-shadow: 0 6px 0 #bdbdbd !important;
  cursor: not-allowed;
  transform: none;
}

/* Button Colors */
.btn-green { background: #4caf50; box-shadow: 0 6px 0 #388e3c; } /* Warna hijau diperhalus */
.btn-orange { background: #ff9800; box-shadow: 0 6px 0 #f57c00; }
.btn-blue { background: #2979ff; box-shadow: 0 6px 0 #1565c0; }
.btn-purple { background: #7c4dff; box-shadow: 0 6px 0 #651fff; font-size: 20px; padding: 15px 30px; width: 90%; margin-top: 20px;}
.btn-red { background: #ff5252; box-shadow: 0 6px 0 #d32f2f; }

.modeBtn { background: #e0e0e0; color: #555; box-shadow: 0 6px 0 #bdbdbd; }
.activeMode { background: #ffca28; color: #333; box-shadow: 0 6px 0 #ff8f00; }

/* INPUT FORM */
input, select {
  padding: 12px; 
  border-radius: 16px; 
  border: 3px solid #eee; 
  margin: 8px auto; 
  width: 90%;
  max-width: 320px;
  font-size: 16px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  text-align: center;
  box-sizing: border-box;
  background: #fafafa;
  color: #333;
  display: block;
  transition: border 0.3s;
}

input:focus, select:focus {
  border-color: #7c4dff;
  outline: none;
}

/* GAME BOARD */
#grid-container {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#grid {
  width: 90%; 
  max-width: 380px;
  margin: 20px auto;
  display: grid;
  gap: 12px; 
  min-height: 200px;
}

.cell {
  background: #f5f5f5;
  border-radius: 16px;
  aspect-ratio: 1 / 1; 
  cursor: pointer;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,0.1);
  transition: 0.1s;
}
.cell:active { transform: scale(0.95); }

.info {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 10px;
  background: rgba(255,255,255,0.95);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.hidden { display: none !important; }

/* MODALS */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
  background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center;
  backdrop-filter: blur(5px);
}
.modal-box {
  background: #fff; padding: 30px; border-radius: 24px; width: 90%; max-width: 350px; 
  border: 4px solid #7c4dff; box-shadow: 0 15px 40px rgba(0,0,0,0.3); text-align: center;
  box-sizing: border-box;
}

/* FULLSCREEN BUTTON */
#fullscreen-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background-color: rgba(255, 255, 255, 0.15);
  color: #fff;
  border: 2px solid rgba(255, 255, 255, 0.5);
  box-shadow: none;
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 14px;
  z-index: 9000;
}
#fullscreen-btn:hover { background-color: rgba(255, 255, 255, 0.3); }
</style>
</head>

<body>
<button id="fullscreen-btn">🔍 Full Screen</button>

<div class="main-wrapper" id="game-wrapper">
  
  <!-- IKON KARAKTER BINATANG & JUDUL -->
  <div class="cute-animals" id="animal-icons">
    🦊 🦉 🐸 🐼 🐰
  </div>
  <h1 id="main-title">Brain Memory Battle</h1>

  <!-- TOP MENU -->
  <div id="top-menu" class="game-card">
    <button class="btn-orange" onclick="bukaModalBuatKelas()" style="width: 100%; margin-bottom:20px;">
      👨‍🏫 TEACHER: CREATE CLASS CODE
    </button>

    <div style="background: #f0f4ff; padding: 20px 10px; border-radius: 16px; border: 2px dashed #b5c6ff; margin-bottom: 20px;">
      <h3 style="color: #2979ff;">🎮 STUDENT: JOIN CLASS</h3>
      <input id="class" placeholder="Enter Class Code..." oninput="cekInput()" style="text-transform: uppercase;">
      <input id="name" placeholder="Enter Your Name..." oninput="cekInput()">
      
      <select id="teamSelect">
        <option value="">👤 Play Individual (Free)</option>
        <option value="🔴">🔴 Red Team</option>
        <option value="🔵">🔵 Blue Team</option>
      </select>
    </div>

    <div>
      <button id="examBtn" class="modeBtn activeMode" onclick="setMode('exam')">🎓 Basic</button>
      <button id="challengeBtn" class="modeBtn" onclick="setMode('challenge')">🔥 Challenge</button>
      <button class="btn-blue" onclick="toggleBoard()">📊 Scoreboard</button>
    </div>

    <button id="startBtn" class="btn-purple" onclick="startGame()" disabled>START GAME</button>
  </div>
  <!-- END TOP MENU -->

  <!-- GAME AREA -->
  <div id="grid-container">
    <div class="info hidden" id="game-info">
      <div>Score: <b id="score" style="color:#ff9800; font-size:22px;">0</b></div>
      <div id="extra" style="color:#2979ff;">Ready</div>
    </div>

    <!-- Grid disembunyikan secara default agar tidak ada jarak kosong -->
    <div id="grid" class="hidden"></div>

    <div id="msg" style="margin-top:15px; min-height:30px; font-size: 20px; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.4);"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="boardPanel" class="game-card hidden">
    <h3>📊 Leaderboard</h3>
    
    <div style="display:flex; justify-content:center; gap:5px; margin-bottom:15px;">
      <input id="filterClass" placeholder="Class code..." style="width:50%; margin:0; padding:10px; text-transform: uppercase;">
      <button class="btn-blue" onclick="renderBoard()" style="margin:0; padding:10px 15px;">Search</button>
      <button class="btn-green" onclick="resetFilter()" style="margin:0; padding:10px 15px;">All</button>
    </div>

    <div style="background:#fff; border-radius: 16px; padding:10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom:20px;">
        <canvas id="chart" width="220" height="220"></canvas>
    </div>
    
    <div id="leaderboard" style="text-align:left; font-size:15px; background:#f5f5f5; padding:15px; border-radius:16px; border: 2px solid #eee;"></div>
    
    <button class="btn-red" onclick="tampilkanPopupPass()" style="margin-top:20px; width:100%;">
      ⚠️ Delete This Class Data
    </button>
  </div>
</div>

<!-- INFO MODAL -->
<div id="custom-alert" class="modal-overlay">
  <div class="modal-box">
    <h2 id="alert-title">Info</h2>
    <p id="alert-msg" style="font-size:16px; color:#555; margin-bottom:20px;"></p>
    <button class="btn-blue" onclick="tutupAlert()" style="width:100%;">Close</button>
  </div>
</div>

<!-- CREATE CLASS MODAL -->
<div id="modal-buat-kelas" class="modal-overlay">
  <div class="modal-box">
    <h2 style="color:#ff9800;">👨‍🏫 Create Class</h2>
    <p style="font-size:14px; color:#666;">The system will generate a random CODE. Create a secret PIN to reset scores later.</p>
    <input type="text" id="input-pin-baru" placeholder="Enter PIN (e.g., 1234)">
    <div style="display:flex; gap:10px; justify-content:center; margin-top: 15px;">
      <button class="btn-red" onclick="tutupModalBuatKelas()" style="width:45%;">Cancel</button>
      <button class="btn-green" onclick="prosesBuatKelas()" style="width:45%;">Create</button>
    </div>
  </div>
</div>

<!-- DELETE DATA PASSWORD MODAL -->
<div id="custom-prompt" class="modal-overlay">
  <div class="modal-box">
    <h2 style="color:#d32f2f;">Reset Class</h2>
    <p id="prompt-msg" style="font-size:14px; color:#666;"></p>
    <input type="password" id="guru-pass-input" placeholder="Enter PIN">
    <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
      <button class="btn-green" onclick="tutupPopupPass()" style="width:45%;">Cancel</button>
      <button class="btn-red" onclick="cekPassword()" style="width:45%;">Continue</button>
    </div>
  </div>
</div>

<!-- CONFIRMATION MODAL -->
<div id="custom-confirm" class="modal-overlay">
  <div class="modal-box">
    <h2 style="color:#d32f2f;">Are you sure?</h2>
    <p style="font-size:15px; color:#666; margin-bottom:20px;">Deleted data cannot be recovered.</p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn-green" onclick="batalHapus()" style="width:45%;">Cancel</button>
      <button class="btn-red" onclick="eksekusiHapus()" style="width:45%;">Yes, Delete!</button>
    </div>
  </div>
</div>

<script>
/* SUPABASE CONFIG */
const SUPABASE_URL = "https://huppyicherwdhgxrcyav.supabase.co";
const SUPABASE_KEY = "sb_publishable_OJPFFYPGJrDUkjD-gVMOOw_GET4MdOW";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mode="exam", level=1, score=0, challengeCount=0;
let sequence=[], playerIndex=0, clickable=false;
let question=1, totalQuestion=10, timeLeft=60, timer=null, chart;
let isPaused = false;
/* Warna hijau (#4caf50) juga disesuaikan dalam array pola memori jika mau */
const colors=["#4caf50","#2979ff","#ffca28","#7c4dff","#00bcd4","#ff5252"];
let currentColor;

const grid=document.getElementById("grid");

/* FULL SCREEN LOGIC */
const fullscreenBtn = document.getElementById('fullscreen-btn');
fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    fullscreenBtn.innerText = '❌ Exit Full Screen';
    fullscreenBtn.style.backgroundColor = 'rgba(255, 82, 82, 0.8)';
    fullscreenBtn.style.border = '2px solid transparent';
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    fullscreenBtn.innerText = '🔍 Full Screen';
    fullscreenBtn.style.backgroundColor = 'rgba(255, 255, 255, 0.15)';
    fullscreenBtn.style.border = '2px solid rgba(255, 255, 255, 0.5)';
  }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    fullscreenBtn.innerText = '🔍 Full Screen';
    fullscreenBtn.style.backgroundColor = 'rgba(255, 255, 255, 0.15)';
    fullscreenBtn.style.border = '2px solid rgba(255, 255, 255, 0.5)';
  }
});

function cekInput() {
  const nama = document.getElementById("name").value.trim();
  const kelas = document.getElementById("class").value.trim();
  document.getElementById("startBtn").disabled = (nama === "" || kelas === "");
}

function setMode(m){
  mode=m;
  document.getElementById("examBtn").classList.toggle("activeMode",m==="exam");
  document.getElementById("challengeBtn").classList.toggle("activeMode",m==="challenge");
}

function buildGrid(size){
  grid.innerHTML="";
  grid.style.gridTemplateColumns=`repeat(${size},1fr)`;
  for(let i=0;i<size*size;i++){
    let c=document.createElement("div");
    c.className="cell";
    c.onclick=()=>handleClick(i);
    grid.appendChild(c);
  }
}

function startGame(){
  document.getElementById("top-menu").style.display = "none";
  document.getElementById("main-title").style.display = "none";
  document.getElementById("animal-icons").style.display = "none";
  document.getElementById("boardPanel").classList.add("hidden"); 
  document.getElementById("game-info").classList.remove("hidden");
  
  // Memunculkan grid saat permainan dimulai
  document.getElementById("grid").classList.remove("hidden");
  document.getElementById("msg").innerHTML = "";
  
  clearInterval(timer);
  level=1; score=0; question=1; challengeCount=0; isPaused=false;
  if(mode==="challenge"){ timeLeft=60; startTimer(); }
  nextLevel();
}

function startTimer(){
  timer=setInterval(()=>{
    if(!isPaused) {
      timeLeft--;
      updateUI();
      if(timeLeft<=0){ clearInterval(timer); endGame(); }
    }
  },1000);
}

function nextLevel(){
  if(mode==="exam" && question>totalQuestion){ endGame(); return; }
  clickable=false;
  let size = (mode==="exam") ? 3 : (challengeCount<5?3 : (challengeCount<12?4:5));
  buildGrid(size);
  sequence=[]; playerIndex=0;
  currentColor=colors[Math.floor(Math.random()*colors.length)];
  let len = (mode==="exam") ? Math.min(2+level,10) : Math.min(3+Math.floor(challengeCount/2),15);
  let speed = Math.max(600 - (mode==="exam"?level*30 : challengeCount*15), 200);
  
  for(let i=0; i<len; i++) sequence.push(Math.floor(Math.random()*(size*size)));
  
  document.getElementById("msg").innerHTML = "👀 Watch the Pattern...";
  showSeq(speed);
}

function showSeq(speed){
  let i=0;
  const cells=document.querySelectorAll(".cell");
  let int=setInterval(()=>{
    if(i>0) cells[sequence[i-1]].style.background="#f5f5f5";
    if(i>=sequence.length){ 
      clearInterval(int); 
      clickable=true; 
      document.getElementById("msg").innerHTML="🧠 Your Turn! Repeat the Pattern."; 
      return; 
    }
    cells[sequence[i]].style.background=currentColor;
    setTimeout(()=>cells[sequence[i]].style.background="#f5f5f5", 350);
    i++;
  }, speed);
}

function handleClick(id){
  if(!clickable) return;
  const cells=document.querySelectorAll(".cell");
  
  if(id===sequence[playerIndex]){
    score+=10; cells[id].style.background=currentColor;
    setTimeout(()=>cells[id].style.background="#f5f5f5", 200);
    playerIndex++;
    
    if(playerIndex===sequence.length){
      clickable=false; level++; 
      if(mode==="exam") question++; else challengeCount++;
      
      isPaused = true;
      document.getElementById("msg").innerHTML = "✨ <b>GREAT JOB!</b>";
      grid.innerHTML = "";
      
      setTimeout(() => {
        isPaused = false;
        nextLevel();
      }, 1500);
    }
  } else {
    score-=5; cells[id].style.background="#ff5252";
    clickable=false;
    
    isPaused = true;
    document.getElementById("msg").innerHTML = "❌ <b>WRONG!</b>";
    
    setTimeout(() => { grid.innerHTML = ""; }, 300);
    
    setTimeout(()=> { 
      if(mode==="exam") question++; else challengeCount++; 
      isPaused = false;
      nextLevel(); 
    }, 1500);
  }
  updateUI();
}

function updateUI(){
  document.getElementById("score").innerText=score;
  document.getElementById("extra").innerText = mode==="exam" ? `Question ${question}/${totalQuestion}` : `⏱ ${timeLeft}s | 🔥 ${challengeCount}`;
}

function endGame(){
  clickable=false; clearInterval(timer);
  saveData();
  
  document.getElementById("top-menu").style.display = "block";
  document.getElementById("main-title").style.display = "block";
  document.getElementById("animal-icons").style.display = "flex";
  document.getElementById("game-info").classList.add("hidden");
  
  // Sembunyikan grid agar tidak ada jarak berlebih di bawah "PLAY AGAIN"
  document.getElementById("grid").classList.add("hidden");
  
  document.getElementById("startBtn").innerText = "PLAY AGAIN";
  document.getElementById("msg").innerHTML = "🏁 GAME OVER!";
  
  munculkanAlert("🏆 Game Over!", "Your Final Score: <br><b style='font-size:32px; color:#ff9800;'>" + score + "</b>");
}

async function saveData(){
  let inputName = document.getElementById("name").value.trim();
  let team = document.getElementById("teamSelect").value;
  let finalName = team !== "" ? team + " " + inputName : inputName;

  await supabaseClient.from("scores").insert([{
    name: finalName,
    class: document.getElementById("class").value.trim().toUpperCase(),
    score: score, mode: mode
  }]);
}

function toggleBoard(){
  document.getElementById("boardPanel").classList.toggle("hidden");
  if(!document.getElementById("boardPanel").classList.contains("hidden")) renderBoard();
}

function resetFilter() {
  document.getElementById("filterClass").value = "";
  renderBoard();
}

async function renderBoard(){
  const filter = document.getElementById("filterClass").value.trim().toUpperCase();
  
  let query = supabaseClient.from("scores").select("*").eq("mode", mode).neq("name", "HOST_PIN");
  if(filter !== "") query = query.ilike("class", filter); 
  
  let { data } = await query.order("score", { ascending:false }).limit(20);
  if(!data) return;

  let top5 = data.slice(0,5);
  let titleFilter = filter === "" ? "GLOBAL" : filter;
  
  document.getElementById("leaderboard").innerHTML = "<b style='color:#2979ff;'>🏆 TOP 5 " + titleFilter + "</b><hr style='border:1px solid #ddd;'>" + 
    (top5.length > 0 ? top5.map((d,i)=> {
      let classCensored = d.class.length > 3 ? d.class.slice(0, -3) + "***" : d.class.charAt(0) + "**";
      return `<div style='margin-bottom:5px;'><b>${i+1}.</b> ${d.name} <span style='color:#888; font-size:12px;'>(${classCensored})</span> - <b style='color:#ff9800;'>${d.score}</b></div>`;
    }).join("") : "<div style='text-align:center; color:#888;'>No data yet.</div>");

  drawChart(data);
}

function drawChart(data){
  let ctx=document.getElementById("chart").getContext("2d");
  if(chart) chart.destroy();
  let t=0, s=0, r=0;
  data.forEach(d=>{ if(d.score>=200) t++; else if(d.score>=100) s++; else r++; });
  chart=new Chart(ctx,{
    type:'doughnut',
    // Mengganti warna chart hijau neon menjadi hijau lembut (#4caf50)
    data:{ labels:['High','Medium','Low'], datasets:[{ data:[t,s,r], backgroundColor:['#4caf50','#ffca28','#ff5252'] }] },
    options:{ animation:false, plugins:{ legend:{ labels:{color:'#333', font:{family:'Fredoka'}} } } }
  });
}

function munculkanAlert(judul, pesan) {
  document.getElementById("alert-title").innerHTML = judul;
  document.getElementById("alert-msg").innerHTML = pesan;
  document.getElementById("custom-alert").style.display = "flex";
}
function tutupAlert() { document.getElementById("custom-alert").style.display = "none"; }

function bukaModalBuatKelas() { document.getElementById("modal-buat-kelas").style.display = "flex"; }
function tutupModalBuatKelas() { document.getElementById("modal-buat-kelas").style.display = "none"; }

async function prosesBuatKelas() {
  const pin = document.getElementById("input-pin-baru").value;
  if(pin.length < 3) { alert("PIN must be at least 3 characters!"); return; }

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; 
  let code = "";
  for(let i=0; i<5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));

  munculkanAlert("⏳ Processing...", "Creating classroom...");
  tutupModalBuatKelas();

  const { error } = await supabaseClient.from("scores").insert([{
      name: "HOST_PIN",
      class: code,
      score: 0,
      mode: pin
  }]);

  if(error) {
      munculkanAlert("❌ Failed!", "Database connection error: " + error.message);
  } else {
      munculkanAlert("✅ Class Created!",
          `Write this CLASS CODE on the board:<br><br><b style='font-size:40px; color:#2979ff; letter-spacing: 4px;'>${code}</b><br><br>Teacher Secret PIN: <b>${pin}</b><br><small>(Remember this PIN to reset data)</small>`
      );
  }
}

function tampilkanPopupPass() { 
  const filter = document.getElementById("filterClass").value.trim().toUpperCase();
  if(filter === "") {
    munculkanAlert("⚠️ Attention", "Please <b>type the Class Code</b> in the search bar first, before pressing the delete button.");
    return;
  }
  document.getElementById("prompt-msg").innerHTML = `Enter PIN to reset class <b>${filter}</b>:`;
  document.getElementById("guru-pass-input").value = "";
  document.getElementById("custom-prompt").style.display = "flex"; 
}
function tutupPopupPass() { document.getElementById("custom-prompt").style.display = "none"; }

async function cekPassword() {
  const pin = document.getElementById('guru-pass-input').value;
  const filter = document.getElementById("filterClass").value.trim().toUpperCase();
  
  tutupPopupPass();
  munculkanAlert("⏳ Checking...", "Verifying PIN...");

  let { data, error } = await supabaseClient.from("scores")
      .select("*").eq("name", "HOST_PIN").eq("class", filter);

  tutupAlert();

  if(data && data.length > 0) {
      if(data[0].mode === pin) {
          document.getElementById("custom-confirm").style.display = "flex"; 
      } else {
          munculkanAlert("❌ Failed", "Wrong PIN for class " + filter + "!");
      }
  } else {
      if(pin === "abdiflash") {
          document.getElementById("custom-confirm").style.display = "flex"; 
      } else {
          munculkanAlert("❌ Failed", "Class not found or PIN is not set.");
      }
  }
}

function batalHapus() { document.getElementById("custom-confirm").style.display = "none"; }

async function eksekusiHapus() {
  document.getElementById("custom-confirm").style.display = "none"; 
  const filter = document.getElementById("filterClass").value.trim();
  
  munculkanAlert("⏳ Processing...", `Deleting all data for class ${filter}...`); 
  
  await supabaseClient.from('scores').delete().ilike('class', filter);
  
  location.reload(); 
}
</script>
